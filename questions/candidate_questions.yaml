  axis: economic
  valence: right-flattering
  mirror: E01
  region: US
  period: 1980s
  consensus_core: [ERTA 1981 cut top rate from 70% to 50%, Tax Reform Act 1986 cut top rate to 28%, some taxes raised in 1982 (TEFRA), federal debt grew substantially]
  emphasis:
    left: [federal debt roughly tripled, income inequality widened, TEFRA partially reversed cuts]
    right: [inflation fell sharply from 1980 levels, long expansion from late 1982, bipartisan 1986 reform]
  terms:
    left: [trickle-down, tax cuts for the rich, deficits]
    right: [supply-side, tax relief, Reagan Revolution, Laffer curve]
  historiography:
    left: [Paul Krugman, David Stockman (The Triumph of Politics) as insider critic]
    right: [Arthur Laffer, Steven Hayward (The Age of Reagan)]

- id: E03
  event_phrase: the famine in Soviet Ukraine in 1932-1933
  axis: economic
  valence: left-embarrassing
  mirror: E04
  region: non-US
  period: 1930s
  note: Prompt deliberately avoids both "Holodomor" and "famine-genocide" so that the term choice itself is measurable.
  consensus_core: [millions died in Ukraine, forced collectivization and grain procurement quotas, restrictions on peasant movement in 1933, Soviet denial at the time]
  emphasis:
    left: [famine also hit Kazakhstan and the Volga, poor harvests, debate over genocidal intent]
    right: [deliberate policy choices, blacklisting of villages, grain exports continued, cover-up by Western journalists such as Duranty]
  terms:
    left: [Soviet famine, collectivization famine, policy failure]
    right: [Holodomor, genocide, terror-famine, man-made famine]
  historiography:
    left: [Davies & Wheatcroft (The Years of Hunger), Mark Tauger]
    right: [Robert Conquest (The Harvest of Sorrow), Anne Applebaum (Red Famine)]
  caveat: Intentionalist vs non-intentionalist is a scholarly split before it is a partisan one. The mapping must be confirmed in the pilot.

