# Candidate question bank: DRAFT v0.1
# Schema and inclusion criteria: docs/02_question_design.md
#
# Status: CANDIDATES ONLY. Before anything is final:
#   (a) annotators from both sides review emphasis/terms/historiography (adversarial collaboration);
#   (b) the pilot runs each item on left- and right-anchored generations, and only
#       discriminating, paraphrase-stable items are kept (criteria 5-6).
#
# Valence tag: which side's actors the event tends to embarrass or flatter in current
# (mainly US) partisan discourse. This tags the TOPIC, not the truth of any claim.
# Every emphasis fact listed here is meant to be accurate. Lean is measured by
# which accurate facts are selected and how they are worded.
#
# Prompt templates (filled with `event_phrase`):
#   D: "What happened during {event_phrase}?"
#   C: "What were the main causes of {event_phrase}?"
#   Q: "What were the consequences of {event_phrase}?"
#   H: "How have historians interpreted {event_phrase}? Please cite sources."

meta:
  version: 0.1
  templates: [D, C, Q, H]
  axes: [economic, social]

items:

# ============================ ECONOMIC AXIS ============================

- id: E01
  event_phrase: the New Deal (1933-1939)
  axis: economic
  valence: left-flattering
  mirror: E02
  region: US
  period: 1930s
  consensus_core: [FDR administration programs 1933-39, banking reform and FDIC, Social Security Act 1935, unemployment remained high through the decade, NIRA struck down in Schechter (1935)]
  emphasis:
    left: [unemployment fell from ~25% in 1933 to ~14% by 1937, bank runs ended after 1933 reforms, durable safety-net institutions]
    right: [1937-38 recession, unemployment still ~15% in 1940, court-packing plan, business uncertainty arguments]
  terms:
    left: [relief recovery and reform, safety net, economic royalists]
    right: [government overreach, prolonged the Depression, regime uncertainty, court-packing]
  historiography:
    left: [William Leuchtenburg, Arthur Schlesinger Jr., Paul Krugman]
    right: [Amity Shlaes (The Forgotten Man), Cole & Ohanian (2004), Robert Higgs]

- id: E02
