<meta charset="utf-8">
<title>Elicitation Panel Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: sticky toolbar, item index on the left, answers in a card grid (compare) or paired rows (mirror). */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --sunk: #e9edf1; --line: #d5dce3;
  --ink: #18212b; --muted: #5b6876; --accent: #0d6b62; --accent-ink: #ffffff;
  --left: #1f5fd6; --left-bg: rgba(31, 95, 214, .14);
  --right: #c42b2b; --right-bg: rgba(196, 43, 43, .13);
  --warn: #9a5b00; --warn-bg: rgba(214, 140, 0, .16);
  --ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161c; --surface: #18202a; --sunk: #0d1217; --line: #2a3542;
  --ink: #e4e9ee; --muted: #93a1b0; --accent: #3cbfae; --accent-ink: #062723;
  --left: #7aa7ff; --left-bg: rgba(122, 167, 255, .2);
  --right: #ff8a80; --right-bg: rgba(255, 138, 128, .18);
  --warn: #f0b44c; --warn-bg: rgba(240, 180, 76, .16);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #18202a; --sunk: #0d1217; --line: #2a3542;
  --ink: #e4e9ee; --muted: #93a1b0; --accent: #3cbfae; --accent-ink: #062723;
  --left: #7aa7ff; --left-bg: rgba(122, 167, 255, .2);
  --right: #ff8a80; --right-bg: rgba(255, 138, 128, .18);
  --warn: #f0b44c; --warn-bg: rgba(240, 180, 76, .16);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -.01em; white-space: nowrap; }
.brand span { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--sunk); }
.seg button { border: 0; background: transparent; padding: 5px 11px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg.tpl button { font-family: var(--mono); min-width: 34px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); }

.shell { display: grid; grid-template-columns: 270px minmax(0, 1fr); align-items: start; }
.index { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h, 54px)); max-height: calc(100vh - var(--bar-h, 54px)); overflow-y: auto;
  border-right: 1px solid var(--line); padding: 14px 10px 24px max(12px, env(safe-area-inset-left, 0px)); }
.index input { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); margin-bottom: 10px; }
.index h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 6px 6px; font-weight: 600; }
.index ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.index li button { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 6px; padding: 6px 8px; cursor: pointer;
  display: grid; grid-template-columns: 34px minmax(0, 1fr) 8px; gap: 8px; align-items: center; }
.index li button:hover { background: var(--sunk); }
.index li button[aria-current="true"] { background: var(--sunk); box-shadow: inset 2px 0 0 var(--accent); }
.index .iid { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.index .iname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dot.v-left-flattering, .dot.v-right-embarrassing { background: var(--left); }
.dot.v-right-flattering, .dot.v-left-embarrassing { background: var(--right); }
.dot.v-contested-attribution, .dot.v-contested-causation { background: linear-gradient(90deg, var(--left) 50%, var(--right) 50%); }

main { min-width: 0; padding-block: 18px 48px; padding-left: 22px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.head { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; max-width: 980px; min-width: 0; }
#answers { min-width: 0; display: grid; gap: 14px; }
.nav { display: none; gap: 8px; }
.nav select { flex: 1; min-width: 0; padding: 7px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
.nav button, .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 11px; cursor: pointer; }
.btn:hover, .nav button:hover { border-color: var(--accent); }
.head h2 { font-family: var(--read); font-size: 26px; font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; }
.head h2 small { font-family: var(--mono); font-size: 14px; color: var(--muted); font-weight: 400; margin-right: 10px; }
.prompt { font-family: var(--mono); font-size: 13px; background: var(--sunk); border: 1px solid var(--line); border-radius: 7px; padding: 8px 12px; }
.prompt b { color: var(--accent); font-weight: 500; margin-right: 8px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); }
.tag.link { cursor: pointer; color: var(--accent); border-color: currentColor; }
details.anno { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details.anno summary { cursor: pointer; padding: 8px 12px; color: var(--muted); font-weight: 500; }
.anno-body { padding: 4px 14px 14px; display: grid; gap: 12px; }
.anno-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.anno-row > div:first-child { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding-top: 3px; }
.anno-row ul { margin: 0; padding-left: 16px; }
.anno-row .L { color: var(--left); } .anno-row .R { color: var(--right); }
.anno-row .L, .anno-row .R { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; font-weight: 600; margin-bottom: 2px; }
.anno-note { font-size: 13px; color: var(--muted); }

.models { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 12px; color: var(--muted); }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.legend mark { padding: 0 4px; }

.grid { min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; align-items: start; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.pair-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h, 54px)); z-index: 2; background: var(--bg); padding-block: 6px; }
.pair-head div { font-family: var(--read); font-weight: 600; font-size: 15px; }
.pair-head small { font-family: var(--mono); color: var(--muted); font-weight: 400; margin-right: 6px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; min-width: 0; display: flex; flex-direction: column; }
.card header { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.card header strong { font-size: 14px; }
.card header .lab { color: var(--muted); font-size: 12px; }
.meta { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cnt { font-family: var(--mono); font-size: 11.5px; padding: 1px 6px; border-radius: 4px; }
.cnt.L { color: var(--left); background: var(--left-bg); } .cnt.R { color: var(--right); background: var(--right-bg); }
.badge { font-size: 11px; padding: 1px 6px; border-radius: 4px; color: var(--warn); background: var(--warn-bg); }
.answer { position: relative; padding: 4px 16px 6px; font-family: var(--read); font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; }
.answer.clamp { max-height: 440px; overflow: hidden; }
.answer.clamp::after { content: ""; position: absolute; inset: auto 0 0; height: 70px; background: linear-gradient(to bottom, transparent, var(--surface)); }
.answer h1, .answer h2, .answer h3, .answer h4 { font-family: var(--ui); font-size: 14.5px; margin: 16px 0 6px; line-height: 1.3; }
.answer p, .answer ul, .answer ol { margin: 8px 0; }
.answer ul, .answer ol { padding-left: 22px; }
.answer table { border-collapse: collapse; font-size: 13px; font-family: var(--ui); display: block; overflow-x: auto; }
.answer th, .answer td { border: 1px solid var(--line); padding: 4px 8px; vertical-align: top; }
.answer code { font-family: var(--mono); font-size: 12.5px; }
.answer hr { border: 0; border-top: 1px solid var(--line); }
.answer blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
mark { color: inherit; border-radius: 3px; padding: 0 1px; }
mark.tL { background: var(--left-bg); box-shadow: inset 0 -2px 0 var(--left); }
mark.tR { background: var(--right-bg); box-shadow: inset 0 -2px 0 var(--right); }
mark.hL { background: transparent; text-decoration: underline dotted var(--left) 2px; text-underline-offset: 3px; }
mark.hR { background: transparent; text-decoration: underline dotted var(--right) 2px; text-underline-offset: 3px; }
.plain mark { background: transparent !important; box-shadow: none !important; text-decoration: none !important; }
.more { border: 0; border-top: 1px solid var(--line); background: transparent; padding: 8px; cursor: pointer; color: var(--accent); font-weight: 500; border-radius: 0 0 9px 9px; }
.more:hover { background: var(--sunk); }
.empty { color: var(--muted); padding: 40px 0; font-size: 15px; }
.missing { padding: 16px; color: var(--muted); font-style: italic; }
.foot { font-size: 12px; color: var(--muted); max-width: 980px; }
.foot code { font-family: var(--mono); }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .index { display: none; }
  .nav { display: flex; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .anno-row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
}
@media (max-width: 700px) {
  .pair, .pair-head { grid-template-columns: minmax(0, 1fr); }
  .pair-head { position: static; }
  .brand span { display: none; }
}
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } }
</style>

<div class="bar" id="bar">
  <div class="brand"><h1>Elicitation Panel Viewer</h1><span id="runinfo">loading…</span></div>
  <div class="seg" id="viewSeg" role="group" aria-label="View">
    <button id="v-compare" data-view="compare" aria-pressed="true">Compare models</button>
    <button id="v-mirror" data-view="mirror" aria-pressed="false">Mirror pair</button>
  </div>
  <div class="seg tpl" id="tplSeg" role="group" aria-label="Question form"></div>
  <label class="toggle"><input type="checkbox" id="hl" checked> Highlight terms</label>
  <label class="toggle"><input type="checkbox" id="expandAll"> Expand all</label>
</div>

<div class="shell">
  <nav class="index" id="index" aria-label="Events">
    <input id="search" type="search" placeholder="Filter events" aria-label="Filter events">
    <div id="indexList"></div>
  </nav>
  <main id="main">
    <div class="empty" id="loading">Loading 1,680 responses from 10 models…</div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
const TPL_NAMES = { D: "Describe", C: "Causes", Q: "Consequences", H: "Historiography" };
const AXES = [["economic", "Economic axis"], ["social", "Social axis"], ["placebo", "Placebo controls"]];
const store = {
  get(k, d) { try { const v = localStorage.getItem("epv:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("epv:" + k, JSON.stringify(v)); } catch {} },
};
let D, byId = {}, matchers = {};
const S = {
  item: null, tpl: store.get("tpl", "D"), view: store.get("view", "compare"),
  hl: store.get("hl", true), expandAll: false, hidden: new Set(store.get("hidden", [])), open: new Set(),
};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const short = (id) => id.split("/")[1].replace(":free", "");

// Pre-registered terms and historians from the item annotation, turned into regexes.
function historianKeys(name) {
  return name.replace(/\(.*?\)/g, "").split(/\s*(?:&|\band\b|,)\s*/)
    .map((p) => p.trim().split(/\s+/).filter((w) => !/^(Jr\.?|Sr\.?)$/.test(w)).pop() || "")
    .filter((k) => k.length >= 4);
}
function rx(words) {
  const ws = [...new Set(words.filter(Boolean))].sort((a, b) => b.length - a.length)
    .map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "\\s+"));
  return ws.length ? new RegExp(`(?<![\\p{L}\\p{N}])(?:${ws.join("|")})(?![\\p{L}\\p{N}])`, "giu") : null;
}
function buildMatchers(it) {
  if (matchers[it.id]) return matchers[it.id];
  const m = {};
  for (const side of ["left", "right"]) {
    m["t" + side[0].toUpperCase()] = rx((it.terms || {})[side] || []);
    m["h" + side[0].toUpperCase()] = rx(((it.historiography || {})[side] || []).flatMap(historianKeys));
  }
  return (matchers[it.id] = m);
}
function counts(text, m) {
  const c = (r) => (r ? (text.match(r) || []).length : 0);
  return { L: c(m.tL) + c(m.hL), R: c(m.tR) + c(m.hR) };
}
function highlight(root, m) {
  const order = ["tL", "tR", "hL", "hR"].filter((k) => m[k]);
  if (!order.length) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const text = node.nodeValue, hits = [];
    for (const k of order) { m[k].lastIndex = 0; let x; while ((x = m[k].exec(text))) hits.push([x.index, x.index + x[0].length, k]); }
    if (!hits.length) continue;
    hits.sort((a, b) => a[0] - b[0] || b[1] - a[1]);
    const frag = document.createDocumentFragment(); let pos = 0;
    for (const [s, e, k] of hits) {
      if (s < pos) continue;
      frag.append(text.slice(pos, s));
      const mk = document.createElement("mark"); mk.className = k; mk.textContent = text.slice(s, e);
      mk.title = { tL: "Left-coded term", tR: "Right-coded term", hL: "Left-associated source", hR: "Right-associated source" }[k];
      frag.append(mk); pos = e;
    }
    frag.append(text.slice(pos)); node.replaceWith(frag);
  }
}

function renderAnswer(text, m) {
  const div = document.createElement("div");
  div.innerHTML = DOMPurify.sanitize(marked.parse(text));
  highlight(div, m);
  return div.innerHTML;
}

function card(model, itemId, tpl) {
  const r = D.responses[`${model.id}|${itemId}|${tpl}`];
  const it = byId[itemId], m = buildMatchers(it), key = `${model.id}|${itemId}|${tpl}`;
  const el = document.createElement("article"); el.className = "card";
  if (!r) { el.innerHTML = `<header><strong>${esc(short(model.id))}</strong></header><div class="missing">No response recorded.</div>`; return el; }
  const words = r.text.trim().split(/\s+/).length, c = counts(r.text, m), scored = it.axis !== "placebo";
  el.innerHTML = `<header><strong>${esc(short(model.id))}</strong><span class="lab">${esc(model.lab)}</span>
    <span class="meta">${scored ? `<span class="cnt L" title="Left-coded terms and sources">L ${c.L}</span><span class="cnt R" title="Right-coded terms and sources">R ${c.R}</span>` : ""}
    <span>${words.toLocaleString()} words</span>${r.cost != null ? `<span>$${r.cost.toFixed(4)}</span>` : ""}
    ${r.finish === "length" ? `<span class="badge">cut off</span>` : ""}</span></header>
    <div class="answer${S.hl ? "" : " plain"}">${renderAnswer(r.text, m)}</div>`;
  const ans = el.querySelector(".answer");
  const isOpen = () => S.expandAll || S.open.has(key);
  const more = document.createElement("button"); more.className = "more";
  const sync = () => { ans.classList.toggle("clamp", !isOpen()); more.textContent = isOpen() ? "Collapse" : "Show full answer"; };
  more.onclick = () => { S.open.has(key) ? S.open.delete(key) : S.open.add(key); if (S.expandAll && !S.open.has(key)) { S.expandAll = false; $("#expandAll").checked = false; } sync(); };
  el.append(more); sync();
  requestAnimationFrame(() => { if (!isOpen() && ans.scrollHeight <= 450) { ans.classList.remove("clamp"); more.hidden = true; } });
  return el;
}

function annotation(it) {
  if (it.axis === "placebo") return `<p class="anno-note">Placebo control: no partisan annotation. Consensus core: ${esc((it.consensus_core || []).join("; "))}.</p>`;
  const list = (xs) => `<ul>${(xs || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
  const row = (label, f) => `<div class="anno-row"><div>${label}</div><div><div class="L">Left</div>${list((it[f] || {}).left)}</div><div><div class="R">Right</div>${list((it[f] || {}).right)}</div></div>`;
  return `<details class="anno" id="anno"${store.get("annoOpen", false) ? " open" : ""}><summary>Annotation: what each side would emphasise</summary><div class="anno-body">
    <div class="anno-row"><div>Consensus core</div><div style="grid-column: span 2">${list(it.consensus_core)}</div></div>
    ${row("Emphasis", "emphasis")}${row("Terms", "terms")}${row("Sources", "historiography")}
    ${it.note ? `<p class="anno-note"><b>Note.</b> ${esc(it.note)}</p>` : ""}${it.caveat ? `<p class="anno-note"><b>Caveat.</b> ${esc(it.caveat)}</p>` : ""}
  </div></details>`;
}

function visibleModels() { return D.models.filter((m) => !S.hidden.has(m.id)); }

function render() {
  const it = byId[S.item], main = $("#main");
  const prompt = D.templates[S.tpl].replace("{e}", it.event_phrase);
  const mirror = it.mirror && it.mirror !== "internal" ? byId[it.mirror] : null;
  const tags = [it.axis + (it.axis === "placebo" ? "" : " axis"), it.valence, it.region, it.period].filter(Boolean)
    .map((t) => `<span class="tag">${esc(t)}</span>`).join("")
    + (mirror ? `<span class="tag link" data-go="${mirror.id}">mirror: ${mirror.id}</span>` : it.mirror === "internal" ? `<span class="tag">internally balanced</span>` : "");
  const opts = D.items.map((x) => `<option value="${x.id}"${x.id === it.id ? " selected" : ""}>${x.id}: ${esc(x.event_phrase)}</option>`).join("");
  main.innerHTML = `<section class="head">
      <div class="nav"><button id="prev" aria-label="Previous event">‹</button><select id="itemSel" aria-label="Event">${opts}</select><button id="next" aria-label="Next event">›</button></div>
      <h2><small>${it.id}</small>${esc(it.event_phrase)}</h2>
      <div class="prompt"><b>${S.tpl}</b>${esc(prompt)}</div>
      <div class="tags">${tags}</div>
      ${annotation(it)}
      <div class="models" id="modelChips"></div>
      ${it.axis !== "placebo" ? `<div class="legend"><span><mark class="tL">term</mark> left-coded term</span><span><mark class="tR">term</mark> right-coded term</span><span><mark class="hL">Name</mark> / <mark class="hR">Name</mark> source associated with left / right</span><span>Counts are raw string matches against the annotation, not scores.</span></div>` : ""}
    </section><section id="answers"></section>
    <p class="foot">Run <code>${esc(D.run)}</code>: temperature ${D.settings.temperature}, no system prompt, reasoning effort ${esc(D.settings.reasoning.effort)}. Keys: ← → previous and next event, 1–4 question form, m switches view.</p>`;

  const chips = $("#modelChips");
  chips.innerHTML = `<span class="lab" style="color:var(--muted);font-size:12px">Models</span>`;
  for (const m of D.models) {
    const b = document.createElement("button"); b.className = "chip"; b.textContent = short(m.id);
    b.setAttribute("aria-pressed", String(!S.hidden.has(m.id)));
    b.onclick = () => { S.hidden.has(m.id) ? S.hidden.delete(m.id) : S.hidden.add(m.id); store.set("hidden", [...S.hidden]); render(); };
    chips.append(b);
  }
  const all = document.createElement("button"); all.className = "chip"; all.textContent = S.hidden.size ? "Show all" : "Hide all";
  all.onclick = () => { S.hidden = S.hidden.size ? new Set() : new Set(D.models.map((m) => m.id)); store.set("hidden", [...S.hidden]); render(); };
  chips.append(all);

  const ans = $("#answers"), models = visibleModels();
  if (!models.length) ans.innerHTML = `<p class="empty">All models are hidden. Pick one above to see its answer.</p>`;
  else if (S.view === "compare" || !mirror) {
    if (S.view === "mirror" && !mirror) ans.insertAdjacentHTML("beforeend", `<p class="anno-note" style="margin:0 0 12px">${it.mirror === "internal" ? "This event is balanced internally, so it has no mirror. Showing all models instead." : "Placebo controls have no mirror. Showing all models instead."}</p>`);
    const g = document.createElement("div"); g.className = "grid";
    for (const m of models) g.append(card(m, it.id, S.tpl));
    ans.append(g);
  } else {
    ans.innerHTML = `<div class="pair-head"><div><small>${it.id}</small>${esc(it.event_phrase)}</div><div><small>${mirror.id}</small>${esc(mirror.event_phrase)}</div></div>`;
    for (const m of models) {
      const p = document.createElement("div"); p.className = "pair";
      p.append(card(m, it.id, S.tpl), card(m, mirror.id, S.tpl));
      ans.append(p);
    }
  }

  main.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => go(b.dataset.go)));
  const anno = $("#anno"); if (anno) anno.ontoggle = () => store.set("annoOpen", anno.open);
  $("#itemSel").onchange = (e) => go(e.target.value);
  $("#prev").onclick = () => step(-1); $("#next").onclick = () => step(1);
  document.querySelectorAll("#indexList button").forEach((b) => b.setAttribute("aria-current", String(b.dataset.id === it.id)));
  document.querySelectorAll("#tplSeg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tpl === S.tpl)));
  document.querySelectorAll("#viewSeg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === S.view)));
}

function go(id, scroll = true) {
  if (!byId[id]) return;
  S.item = id; S.open.clear(); store.set("item", id);
  try { history.replaceState(null, "", "#" + id); } catch {}
  render(); if (scroll) window.scrollTo({ top: 0 });
  const cur = document.querySelector(`#indexList button[data-id="${id}"]`); if (cur) cur.scrollIntoView({ block: "nearest" });
}
function step(d) { const i = D.items.findIndex((x) => x.id === S.item); go(D.items[(i + d + D.items.length) % D.items.length].id); }

function buildIndex() {
  const q = $("#search").value.trim().toLowerCase(), list = $("#indexList");
  list.innerHTML = "";
  for (const [axis, title] of AXES) {
    const its = D.items.filter((x) => x.axis === axis && (!q || (x.id + " " + x.event_phrase).toLowerCase().includes(q)));
    if (!its.length) continue;
    list.insertAdjacentHTML("beforeend", `<h2>${title}</h2>`);
    const ul = document.createElement("ul");
    for (const x of its) {
      const li = document.createElement("li");
      li.innerHTML = `<button data-id="${x.id}" aria-current="${x.id === S.item}" title="${esc(x.event_phrase)}${x.valence ? " · " + esc(x.valence) : ""}"><span class="iid">${x.id}</span><span class="iname">${esc(x.event_phrase)}</span><span class="dot v-${x.valence || "none"}"></span></button>`;
      li.firstChild.onclick = () => go(x.id);
      ul.append(li);
    }
    list.append(ul);
  }
}

function measureBar() { document.documentElement.style.setProperty("--bar-h", $("#bar").offsetHeight + "px"); }

async function init() {
  try {
    const res = await fetch("data.json");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    D = await res.json();
  } catch (e) {
    $("#loading").textContent = `Could not load the responses (data.json): ${e.message}. Reload the page to try again.`;
    return;
  }
  D.items.forEach((x) => (byId[x.id] = x));
  $("#runinfo").textContent = `${D.run} · ${D.models.length} models · ${Object.keys(D.responses).length.toLocaleString()} responses`;
  const seg = $("#tplSeg");
  for (const k of Object.keys(D.templates)) {
    const b = document.createElement("button"); b.id = "t-" + k; b.dataset.tpl = k; b.textContent = k; b.title = TPL_NAMES[k] || k;
    b.onclick = () => { S.tpl = k; store.set("tpl", k); S.open.clear(); render(); };
    seg.append(b);
  }
  if (!D.templates[S.tpl]) S.tpl = "D";
  document.querySelectorAll("#viewSeg button").forEach((b) => (b.onclick = () => { S.view = b.dataset.view; store.set("view", S.view); render(); }));
  $("#hl").checked = S.hl;
  $("#hl").onchange = (e) => { S.hl = e.target.checked; store.set("hl", S.hl); document.querySelectorAll(".answer").forEach((a) => a.classList.toggle("plain", !S.hl)); };
  $("#expandAll").onchange = (e) => { S.expandAll = e.target.checked; S.open.clear(); render(); };
  $("#search").oninput = buildIndex;
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowRight") step(1);
    else if (e.key === "ArrowLeft") step(-1);
    else if ("1234".includes(e.key) && e.key.length === 1) { S.tpl = Object.keys(D.templates)[+e.key - 1]; store.set("tpl", S.tpl); S.open.clear(); render(); }
    else if (e.key === "m") { S.view = S.view === "compare" ? "mirror" : "compare"; store.set("view", S.view); render(); }
  });
  const hash = location.hash.slice(1).toUpperCase();
  S.item = byId[hash] ? hash : byId[store.get("item", "")] ? store.get("item") : D.items[0].id;
  buildIndex(); measureBar(); go(S.item, false);
  window.addEventListener("resize", measureBar);
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1).toUpperCase(); if (byId[h] && h !== S.item) go(h); });
}
init();
</script>
